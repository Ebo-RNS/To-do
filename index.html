<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal To-Do App (Vintage Edition)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap');

    :root {
      --bg: #1c1917;
      --card-bg: #292524;
      --paper-bg: #44403c;
      --text-main: #e7e5e4;
      --text-muted: #a8a29e;
      --accent-gold: #d97706;
      --accent-hover: #b45309;
      --border-color: #78716c;
      --border-dark: #1c1917;
      --done-bg: #1c1917;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(41, 37, 36, 0.5) 0%, rgba(28, 25, 23, 0.95) 100%),
        repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
      color: var(--text-main);
      font-family: 'Courier Prime', Courier, monospace;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 3px double var(--accent-gold);
      padding-bottom: 15px;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.4rem;
      color: var(--accent-gold);
      margin: 0 0 8px 0;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .subtitle {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      padding: 22px;
      margin-bottom: 25px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0,0,0,0.3);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px;
      border: 1px dashed rgba(168, 162, 158, 0.2);
      pointer-events: none;
    }

    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: var(--accent-gold);
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 1.35rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .full-width {
      grid-column: span 2;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-family: 'Courier Prime', Courier, monospace;
      font-size: 0.95rem;
      border-radius: 2px;
      box-shadow: inset 1px 1px 4px rgba(0,0,0,0.7);
    }

    input[type="text"]:focus, select:focus {
      outline: 1px solid var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      font-family: 'Courier Prime', Courier, monospace;
      padding: 10px 20px;
      border: 1px solid var(--accent-gold);
      border-radius: 2px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent-gold);
      color: #1c1917;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #ffffff;
    }

    .btn-cancel {
      background-color: transparent;
      color: var(--text-muted);
      border-color: var(--border-color);
    }

    .btn-cancel:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .filters {
      display: flex;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .filters label {
      margin-bottom: 0;
      display: inline-block;
    }

    .filters select {
      width: auto;
      display: inline-block;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--accent-gold);
      border-radius: 2px;
      padding: 14px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.4);
      transition: background 0.2s ease;
    }

    /* Completed state styling */
    .task-item.completed {
      background-color: var(--done-bg);
      border-left-color: var(--border-color);
      opacity: 0.6;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-grow: 1;
    }

    .task-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--accent-gold);
      background-color: var(--bg);
      cursor: pointer;
      position: relative;
      border-radius: 2px;
    }

    .task-checkbox:checked {
      background-color: var(--accent-gold);
    }

    .task-checkbox:checked::after {
      content: '✓';
      position: absolute;
      color: #1c1917;
      font-weight: bold;
      font-size: 14px;
      top: -2px;
      left: 3px;
    }

    .task-details {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.75rem;
    }

    .tag {
      padding: 2px 8px;
      border-radius: 2px;
      background-color: #1c1917;
      color: var(--text-muted);
      border: 1px solid #44403c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tag-term {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .tag-partner {
      border-color: #78716c;
      color: #d6d3d1;
    }

    .task-actions {
      display: flex;
      gap: 8px;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.75rem;
    }

    .btn-danger {
      background-color: transparent;
      color: #ef4444;
      border-color: #991b1b;
    }

    .btn-danger:hover {
      background-color: #991b1b;
      color: #ffffff;
    }

    .btn-edit {
      background-color: transparent;
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .btn-edit:hover {
      background-color: var(--accent-gold);
      color: #1c1917;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-style: italic;
      padding: 30px;
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>To-Do</h1>
    </header>

    <!-- ADD / EDIT TASK FORM -->
    <div class="card">
      <h2 id="form-heading">Add New Entry</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" />
        
        <div class="form-grid">
          <div class="full-width">
            <label for="task-title">Task Title *</label>
            <input type="text" id="task-title" placeholder="Brief statement of task..." required />
          </div>

          <div>
            <label for="task-term">Timeframe *</label>
            <select id="task-term" required>
              <option value="Short-term">Short-term (Session / Week)</option>
              <option value="Long-term">Long-term (Term / Goal)</option>
            </select>
          </div>

          <div>
            <label for="task-component">Component *</label>
            <select id="task-component" required>
              <option value="Code">Code</option>
              <option value="Design">Design</option>
              <option value="Docs">Docs</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="full-width">
            <label for="task-partner">Partner Collaboration (Optional)</label>
            <input type="text" id="task-partner" placeholder="Partner's name..." />
          </div>
        </div>

        <div class="btn-group">
          <button type="submit" id="save-btn" class="btn-primary">Record Task</button>
          <button type="button" id="cancel-btn" class="btn-cancel" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- FILTERS -->
    <div class="card">
      <div class="filters">
        <strong style="color: var(--accent-gold); text-transform: uppercase; letter-spacing: 0.5px;">Filter Log:</strong>
        <div>
          <label for="filter-term">Term:</label>
          <select id="filter-term">
            <option value="All">All</option>
            <option value="Short-term">Short-term</option>
            <option value="Long-term">Long-term</option>
          </select>
        </div>

        <div>
          <label for="filter-component">Component:</label>
          <select id="filter-component">
            <option value="All">All</option>
            <option value="Code">Code</option>
            <option value="Design">Design</option>
            <option value="Docs">Docs</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
    </div>

    <!-- TASK LIST -->
    <ul id="task-list" class="task-list"></ul>
  </div>

  <script>
    // --- STATE MANAGEMENT & LOCAL STORAGE ---
    const STORAGE_KEY = 'personal_todo_tasks_vintage_v1';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // --- DOM ELEMENTS ---
    const taskForm = document.getElementById('task-form');
    const taskIdInput = document.getElementById('task-id');
    const titleInput = document.getElementById('task-title');
    const termInput = document.getElementById('task-term');
    const componentInput = document.getElementById('task-component');
    const partnerInput = document.getElementById('task-partner');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formHeading = document.getElementById('form-heading');

    const filterTerm = document.getElementById('filter-term');
    const filterComponent = document.getElementById('filter-component');
    const taskList = document.getElementById('task-list');

    // --- RENDER TASKS ---
    function renderTasks() {
      taskList.innerHTML = '';

      const termFilterVal = filterTerm.value;
      const componentFilterVal = filterComponent.value;

      const filteredTasks = tasks.filter(task => {
        const matchesTerm = (termFilterVal === 'All') || (task.term === termFilterVal);
        const matchesComponent = (componentFilterVal === 'All') || (task.component === componentFilterVal);
        return matchesTerm && matchesComponent;
      });

      if (filteredTasks.length === 0) {
        taskList.innerHTML = '<li class="empty-msg">No tasks registered in log.</li>';
        return;
      }

      filteredTasks.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;

        li.innerHTML = `
          <div class="task-main">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleComplete('${task.id}')" />
            <div class="task-details">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <div class="tags">
                <span class="tag tag-term">${task.term}</span>
                <span class="tag">${task.component}</span>
                ${task.partner ? `<span class="tag tag-partner">Partner: ${escapeHtml(task.partner)}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="task-actions">
            <button class="btn-sm btn-edit" onclick="editTask('${task.id}')">Edit</button>
            <button class="btn-sm btn-danger" onclick="deleteTask('${task.id}')">Delete</button>
          </div>
        `;

        taskList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // --- ACTIONS ---
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const id = taskIdInput.value;
      const title = titleInput.value.trim();
      const term = termInput.value;
      const component = componentInput.value;
      const partner = partnerInput.value.trim();

      if (!title) return;

      if (id) {
        const taskIndex = tasks.findIndex(t => t.id === id);
        if (taskIndex > -1) {
          tasks[taskIndex].title = title;
          tasks[taskIndex].term = term;
          tasks[taskIndex].component = component;
          tasks[taskIndex].partner = partner;
        }
      } else {
        const newTask = {
          id: Date.now().toString(),
          title,
          term,
          component,
          partner,
          completed: false
        };
        tasks.push(newTask);
      }

      saveTasks();
      resetForm();
      renderTasks();
    });

    window.toggleComplete = function(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasks();
        renderTasks();
      }
    };

    window.editTask = function(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        taskIdInput.value = task.id;
        titleInput.value = task.title;
        termInput.value = task.term;
        componentInput.value = task.component;
        partnerInput.value = task.partner || '';

        formHeading.textContent = 'Edit Entry';
        saveBtn.textContent = 'Update Entry';
        cancelBtn.style.display = 'inline-block';
        
        taskForm.scrollIntoView({ behavior: 'smooth' });
      }
    };

    window.deleteTask = function(id) {
      if (confirm('Are you sure you want to delete this task entry?')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
        renderTasks();
      }
    };

    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
      taskIdInput.value = '';
      taskForm.reset();
      formHeading.textContent = 'Add New Entry';
      saveBtn.textContent = 'Record Task';
      cancelBtn.style.display = 'none';
    }

    filterTerm.addEventListener('change', renderTasks);
    filterComponent.addEventListener('change', renderTasks);

    renderTasks();
  </script>
</body>
</html>
